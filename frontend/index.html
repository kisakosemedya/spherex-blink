<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Revisit · Explore the infrared sky with NASA SPHEREx</title>
<meta name="description" content="Compare real NASA SPHEREx observations of any patch of sky across dates and see what moved or changed brightness. NASA Space Apps Challenge 2026.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&family=Orbitron:wght@400;500&family=Oxanium:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=2">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/aladin-lite@3.8.2/dist/aladin.js" crossorigin>
<link rel="preconnect" href="https://irsa.ipac.caltech.edu" crossorigin>
</head>
<body>
<a class="sr" href="#main">Skip to content</a>

<header class="nav" id="nav">
  <a class="brand" href="/" data-link="home"><img src="assets/logo.png" alt="Sky Revisit" width="58" height="40"></a>
  <nav aria-label="Main">
    <ul class="menu" id="menu">
      <li><a href="?view=map" data-link="map" data-t="nav.map"></a></li>
      <li><a href="?view=targets" data-link="targets" data-t="nav.targets"></a></li>
      <li><a href="?view=guide" data-link="guide" data-t="nav.guide"></a></li>
      <li><a href="?view=credits" data-link="credits" data-t="nav.credits"></a></li>
      <li class="lang-mobile" id="lang-mobile"></li>
    </ul>
  </nav>
  <div class="nav-tools">
    <div class="lang" id="lang" role="group" aria-label="Language"></div>
    <form class="search" id="search" role="search" autocomplete="off">
      <button class="icon-btn search-toggle" type="button" id="search-toggle" aria-expanded="false" aria-controls="q"><span class="sr" data-t="search"></span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg></button>
      <label class="sr" for="q" data-t="search"></label>
      <input id="q" type="search" data-t-ph="search" spellcheck="false" aria-describedby="q-hint" aria-autocomplete="list" aria-controls="suggest">
      <span class="sr" id="q-hint" data-t="searchHint"></span>
      <ul class="suggest" id="suggest" role="listbox" hidden></ul>
    </form>
    <button class="btn btn--sm btn--plain nav-open tour-btn" id="tour-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2M12 17h.01"/></svg><span class="t" data-t="tour"></span></button>
    <a class="btn btn--primary btn--sm nav-open" href="?view=observations" data-link="observations" data-t="open"></a>
    <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">
      <span class="sr" data-t="menu"></span>
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <div class="view" id="view-home"></div>
  <div class="view" id="view-map"></div>
  <div class="view" id="view-targets"></div>
  <div class="view" id="view-target"></div>
  <div class="view" id="view-observations"></div>
  <div class="view" id="view-guide"></div>
  <div class="view" id="view-credits"></div>
</main>

<!-- One observation workspace, moved between the Observations page and the target pages. -->
<div id="ws-home" hidden>
  <section class="ws" id="ws" aria-label="Observation workspace">
    <div class="ws-main">
      <div class="ws-head">
        <h1 id="ws-name"></h1>
        <span class="mono" id="ws-meta"></span>
      </div>
      <div class="picker" id="picker" role="group"></div>
      <div class="stage-box">
        <div class="stage crop" id="stage" tabindex="0">
          <i class="cm tl"></i><i class="cm tr"></i><i class="cm bl"></i><i class="cm br"></i>
          <canvas id="canvas" width="50" height="50"></canvas>
          <svg class="overlay" id="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"><g id="compass"></g></svg>
          <span class="stage-date" id="stage-date"></span>
          <div class="veil" id="veil" hidden>
            <div>
              <div class="spinner" id="spinner"></div>
              <p id="veil-text" role="status"></p>
              <button class="btn btn--sm" id="retry" type="button" data-t="retry" hidden></button>
              <p class="fact" id="veil-fact"></p>
            </div>
          </div>
        </div>
      </div>
      <div class="ws-controls">
        <div class="row">
          <button class="icon-btn" id="prev" type="button" disabled><span class="sr" data-t="prev"></span><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="btn btn--sm btn--primary" id="play" type="button" disabled></button>
          <button class="icon-btn" id="next" type="button" disabled><span class="sr" data-t="next"></span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
          <span style="width:.5rem"></span>
          <button class="btn btn--sm btn--plain" id="m-blink" type="button" data-t="blink" aria-pressed="true"></button>
          <button class="btn btn--sm btn--plain" id="m-compare" type="button" data-t="compare" aria-pressed="false"></button>
          <button class="btn btn--sm btn--plain" id="m-diff" type="button" data-t="difference" aria-pressed="false"></button>
          <button class="btn btn--sm btn--plain" id="adv-toggle" type="button" data-t="advanced" aria-expanded="false" aria-controls="adv" style="margin-left:auto"></button>
        </div>
        <div class="timeline-strip" id="frames"></div>
        <div class="row" id="compare-row" hidden>
          <label class="small muted"><span data-t="dateA"></span> <select id="dateA"></select></label>
          <label class="small muted"><span data-t="dateB"></span> <select id="dateB"></select></label>
        </div>
        <p class="legend" id="legend" hidden></p>
        <p class="status" id="archive-status" role="status"></p>
        <button class="btn btn--sm" id="refine" type="button" data-t="refine" hidden></button>
        <div class="adv" id="adv" hidden>
          <label><span data-t="detector"></span><select id="det"></select></label>
          <label><span data-t="fov"></span>
            <select id="fov"><option value="90">90″</option><option value="150">150″</option><option value="200">200″</option><option value="300">300″</option><option value="600">600″</option></select></label>
          <label><span data-t="speed"></span><input id="speed" type="range" min="150" max="1500" step="50" value="700"></label>
          <label><span data-t="brightness"></span><input id="stretch" type="range" min="-10" max="20" step="1" value="0"></label>
        </div>
      </div>
    </div>
    <aside class="ws-side">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-target" aria-selected="true" aria-controls="pane-target" data-t="tabs.target"></button>
        <button type="button" role="tab" id="tab-layers" aria-selected="false" aria-controls="pane-layers" data-t="tabs.layers"></button>
        <button type="button" role="tab" id="tab-measure" aria-selected="false" aria-controls="pane-measure" data-t="tabs.measure"></button>
        <button type="button" role="tab" id="tab-share" aria-selected="false" aria-controls="pane-share" data-t="tabs.share"></button>
      </div>
      <div class="tab-body" role="tabpanel" id="pane-target"></div>
      <div class="tab-body" role="tabpanel" id="pane-layers" hidden></div>
      <div class="tab-body" role="tabpanel" id="pane-measure" hidden><p class="muted" data-t="measureHelp"></p><div class="spec-click" id="spec-click"></div></div>
      <div class="tab-body share-box" role="tabpanel" id="pane-share" hidden></div>
    </aside>
  </section>
</div>

<footer id="footer"></footer>
<div class="tour" id="tour" hidden role="dialog" aria-live="polite"></div>

<script type="module" src="app.js?v=2"></script>
</body>
</html>
